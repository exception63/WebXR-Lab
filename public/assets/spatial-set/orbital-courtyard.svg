<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">WebXR-Lab 轨道庭院预览</title>
  <desc id="desc">薄荷色与琥珀色拱门围绕中央平台的空间布景。</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#16352e"/>
      <stop offset=".5" stop-color="#081713"/>
      <stop offset="1" stop-color="#020806"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#19362f"/>
      <stop offset="1" stop-color="#030a08"/>
    </linearGradient>
    <filter id="mint-glow" x="-100%" y="-100%" width="300%" height="300%">
