    </filter>
    <filter id="amber-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#space)"/>
